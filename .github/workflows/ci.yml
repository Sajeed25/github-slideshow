name: CI

on:
  pull_request:
  push:
    branches: [master, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kalwings
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kalwings
          POSTGRES_PASSWORD: kalwings
          POSTGRES_DB: kalwings
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kalwings" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://kalwings:kalwings@localhost:5432/kalwings
      AUTH_SECRET: ci-only-secret-0123456789abcdef0123456789abcdef
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: kalwings/package-lock.json
      - run: npm ci
      - name: Prisma schema is valid and migrations apply cleanly
        run: |
          npx prisma validate
          npx prisma migrate deploy
      - name: Schema and migrations are in sync (fails if someone edited schema.prisma without a migration)
        run: |
          PGPASSWORD=kalwings psql -h localhost -U kalwings -d postgres -c "CREATE DATABASE kalwings_shadow"
          npx prisma migrate diff --from-migrations prisma/migrations --to-schema-datamodel prisma/schema.prisma --shadow-database-url "postgresql://kalwings:kalwings@localhost:5432/kalwings_shadow" --exit-code
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - name: Smoke test (health endpoint)
        run: |
          npm start &
          for i in $(seq 1 30); do curl -fs http://localhost:3000/api/health && exit 0; sleep 2; done
          echo "health check failed"; exit 1
