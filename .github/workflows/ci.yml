name: CI

on:
  pull_request:
  push:
    branches: [master, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kalwings
    services:
      mysql:
        image: mariadb:10.11   # Hostinger runs MariaDB/MySQL
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: kalwings
        ports: ["3306:3306"]
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/kalwings
      AUTH_SECRET: ci-only-secret-0123456789abcdef0123456789abcdef
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: kalwings/package-lock.json
      - run: npm ci
      - name: Prisma schema is valid and migrations apply cleanly
        run: |
          npx prisma validate
          npx prisma migrate deploy
      - name: Schema and migrations are in sync (fails if someone edited schema.prisma without a migration)
        run: |
          mysql -h127.0.0.1 -uroot -proot -e "CREATE DATABASE kalwings_shadow"
          npx prisma migrate diff --from-migrations prisma/migrations --to-schema-datamodel prisma/schema.prisma --shadow-database-url "mysql://root:root@127.0.0.1:3306/kalwings_shadow" --exit-code
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - name: Smoke test (health endpoint)
        run: |
          npm start &
          for i in $(seq 1 30); do curl -fs http://localhost:3000/api/health && exit 0; sleep 2; done
          echo "health check failed"; exit 1
